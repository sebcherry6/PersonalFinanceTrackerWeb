# Static security analysis of the C# code with GitHub CodeQL.
# Results show up under the repo's Security tab -> Code scanning. Free for public repos.
#
# Runs on pushes to main, on pull requests, and weekly (new queries pick up issues in old code).

name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # needed to upload the results, nothing else

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality

      - name: Build
        run: dotnet build PersonalFinanceTracker.Web.slnx --configuration Release

      - uses: github/codeql-action/analyze@v4
